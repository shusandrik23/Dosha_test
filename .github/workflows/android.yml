# Сборка APK Dosha test при каждом обновлении.
# Готовый файл: Actions → последний запуск «Android APK» → Artifacts → dosha-test-debug.
name: Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dosha-test-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
